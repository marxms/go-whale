name: gowhale

# Minimal local journey: Redis (hot tier) + GoWhale. QuestDB is not part of
# this stack; integration and schema checks use compose.integration.yaml.
services:
  redis:
    # Pinned by tag and manifest-list digest (verified 2026-11-05).
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    command:
      - redis-server
      - --appendonly
      - "yes"
      # The example dataset is disposable, so it is never evicted silently:
      # writes fail instead of dropping keys. The startup gate may refuse to
      # boot once resident families without TTL exist; use a throwaway volume
      # for the example and do not copy this policy to a deployment.
      - --maxmemory-policy
      - noeviction
      # Declared so `gowhale doctor` can compare the indicator cap against the
      # server directive; the indicator cap must stay at or below this value.
      - --zset-max-listpack-entries
      - "512"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private

  gowhale:
    build:
      context: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      GOWHALE_CONFIG_FILE: /etc/gowhale/config.yaml
      GOWHALE_REDIS_ADDR: redis:6379
      GOWHALE_QUESTDB_ENABLED: "false"
      GOWHALE_COINALYZE_ENABLED: "false"
    volumes:
      - ./config.example.yaml:/etc/gowhale/config.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    networks:
      - private

volumes:
  redis-data:

networks:
  private:
    driver: bridge
